services:
  - type: web
    name: smart-campus-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        value: mysql://3BLJwfELyGU8yqG.root:2O0zfk2gLq827CwW@gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/smart_campus
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
